name: sqlite_crdt
description: Dart implementation of Conflict-free Replicated Data Types (CRDTs) using Sqlite
version: 4.0.0
homepage: https://github.com/cachapa/sqlite_crdt
repository: https://github.com/cachapa/sqlite_crdt
issue_tracker: https://github.com/cachapa/sqlite_crdt/issues

environment:
  sdk: ^3.0.0

dependencies:
  sqflite_common: ^2.5.4+5
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^0.4.5+3
  sql_crdt: ^4.0.0

dependency_overrides:
  sql_crdt:
    git:
      url: https://github.com/JanezStupar/sql_crdt.git
      ref: feature/postgres_related

dev_dependencies:
  lints: any
  test: any
